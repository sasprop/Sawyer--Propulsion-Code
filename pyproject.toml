[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propellant-analyzer"
dynamic = ["version"]
description = "Solid-propellant formulation, performance, chemistry and flame-colour screening on NASA CEA (RocketCEA)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "rocketcea>=1.1",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=7"]

[project.gui-scripts]
propellant-analyzer = "propellant_analyzer.app:main"

[tool.setuptools.dynamic]
version = { attr = "propellant_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propellant_analyzer = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
